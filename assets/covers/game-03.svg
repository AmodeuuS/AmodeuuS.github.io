<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050507"/><stop offset=".55" stop-color="#11100c"/><stop offset="1" stop-color="#030306"/></linearGradient>
 <radialGradient id="g1"><stop stop-color="#ff3b30" stop-opacity=".32"/><stop offset="1" stop-color="#ff3b30" stop-opacity="0"/></radialGradient>
 <radialGradient id="g2"><stop stop-color="#f6ff00" stop-opacity=".27"/><stop offset="1" stop-color="#f6ff00" stop-opacity="0"/></radialGradient>
 <filter id="glitch"><feTurbulence type="fractalNoise" baseFrequency=".012 .15" numOctaves="1" seed="42" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
 <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
 <style>
  .title{fill:#f8f7fb;font-family:'Arial Black','DejaVu Sans',sans-serif;font-size:48px;font-weight:900;text-anchor:middle;letter-spacing:-1px}
  .label{fill:#ff3b30;font-family:monospace;font-size:21px;font-weight:700;letter-spacing:4px;text-anchor:middle}
  .year{fill:#fff;font-family:monospace;font-size:23px;text-anchor:middle;opacity:.82}
  .meta{fill:#f6ff00;font-family:monospace;font-size:16px;text-anchor:middle;letter-spacing:1px;opacity:.9}
  .thin{stroke:#fff;stroke-opacity:.11;stroke-width:2} .frame{fill:none;stroke:#ff3b30;stroke-opacity:.28;stroke-width:3} .holes rect{fill:#f6ff00;opacity:.25}
  .screen{fill:none;stroke:#f6ff00;stroke-opacity:.24;stroke-width:3} .spark{fill:#ff3b30;opacity:.12;filter:url(#glitch)} .grid{stroke:#f6ff00;stroke-opacity:.08;stroke-width:1} .dpad{fill:#ff3b30;opacity:.10}
 </style>
</defs>
<rect width="600" height="900" rx="28" fill="url(#bg)"/>
<circle cx="102" cy="360" r="140" fill="url(#g1)"/>
<circle cx="276" cy="496" r="90" fill="url(#g2)"/>
