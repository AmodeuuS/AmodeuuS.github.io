<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050507"/><stop offset=".55" stop-color="#0c1116"/><stop offset="1" stop-color="#030306"/></linearGradient>
 <radialGradient id="g1"><stop stop-color="#00f4ee" stop-opacity=".32"/><stop offset="1" stop-color="#00f4ee" stop-opacity="0"/></radialGradient>
 <radialGradient id="g2"><stop stop-color="#ff00d4" stop-opacity=".27"/><stop offset="1" stop-color="#ff00d4" stop-opacity="0"/></radialGradient>
 <filter id="glitch"><feTurbulence type="fractalNoise" baseFrequency=".012 .15" numOctaves="1" seed="6" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
 <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
 <style>
  .title{fill:#f8f7fb;font-family:'Arial Black','DejaVu Sans',sans-serif;font-size:48px;font-weight:900;text-anchor:middle;letter-spacing:-1px}
  .label{fill:#00f4ee;font-family:monospace;font-size:21px;font-weight:700;letter-spacing:4px;text-anchor:middle}
  .year{fill:#fff;font-family:monospace;font-size:23px;text-anchor:middle;opacity:.82}
  .meta{fill:#ff00d4;font-family:monospace;font-size:16px;text-anchor:middle;letter-spacing:1px;opacity:.9}
  .thin{stroke:#fff;stroke-opacity:.11;stroke-width:2} .frame{fill:none;stroke:#00f4ee;stroke-opacity:.28;stroke-width:3} .holes rect{fill:#ff00d4;opacity:.25}
  .screen{fill:none;stroke:#ff00d4;stroke-opacity:.24;stroke-width:3} .spark{fill:#00f4ee;opacity:.12;filter:url(#glitch)} .grid{stroke:#ff00d4;stroke-opacity:.08;stroke-width:1} .dpad{fill:#00f4ee;opacity:.10}
 </style>
</defs>
<rect width="600" height="900" rx="28" fill="url(#bg)"/>
<circle cx="264" cy="167" r="198" fill="url(#g1)"/>
<circle cx="194" cy="462" r="117" fill="url(#g2)"/>
<g opacity=".78"><g class="spark"><path d="M110 245 137 315 210 340 137 365 110 435 83 365 10 340 83 315Z"/><path d="M490 585 507 630 554 648 507 666 490 712 473 666 426 648 473 630Z"/></g></g>
<path d="M38 88H562M38 812H562" stroke="#fff" stroke-opacity=".12"/>
<text x="300" y="82" class="label">// АНИМЕ</text>
<text x="300" y="470" class="title">Аркнайтс 3 сезон</text>
<text x="300" y="798" class="year">2025</text>

<rect width="600" height="900" fill="url(#scan)" opacity=".8"/>
<path d="M0 328h600M0 334h600M0 622h600" stroke="#00f4ee" stroke-opacity=".18" stroke-width="2"/>
<path d="M25 31h105v3H25zM470 866h105v3H470z" fill="#ff00d4" opacity=".7"/>
</svg>