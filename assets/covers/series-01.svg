<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050507"/><stop offset=".55" stop-color="#11101a"/><stop offset="1" stop-color="#030306"/></linearGradient>
 <radialGradient id="g1"><stop stop-color="#ff00d4" stop-opacity=".32"/><stop offset="1" stop-color="#ff00d4" stop-opacity="0"/></radialGradient>
 <radialGradient id="g2"><stop stop-color="#7b61ff" stop-opacity=".27"/><stop offset="1" stop-color="#7b61ff" stop-opacity="0"/></radialGradient>
 <filter id="glitch"><feTurbulence type="fractalNoise" baseFrequency=".012 .15" numOctaves="1" seed="90" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
 <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
 <style>
  .title{fill:#f8f7fb;font-family:'Arial Black','DejaVu Sans',sans-serif;font-size:48px;font-weight:900;text-anchor:middle;letter-spacing:-1px}
  .label{fill:#ff00d4;font-family:monospace;font-size:21px;font-weight:700;letter-spacing:4px;text-anchor:middle}
  .year{fill:#fff;font-family:monospace;font-size:23px;text-anchor:middle;opacity:.82}
  .meta{fill:#7b61ff;font-family:monospace;font-size:16px;text-anchor:middle;letter-spacing:1px;opacity:.9}
  .thin{stroke:#fff;stroke-opacity:.11;stroke-width:2} .frame{fill:none;stroke:#ff00d4;stroke-opacity:.28;stroke-width:3} .holes rect{fill:#7b61ff;opacity:.25}
  .screen{fill:none;stroke:#7b61ff;stroke-opacity:.24;stroke-width:3} .spark{fill:#ff00d4;opacity:.12;filter:url(#glitch)} .grid{stroke:#7b61ff;stroke-opacity:.08;stroke-width:1} .dpad{fill:#ff00d4;opacity:.10}
 </style>
</defs>
<rect width="600" height="900" rx="28" fill="url(#bg)"/>
<circle cx="166" cy="187" r="205" fill="url(#g1)"/>
<circle cx="321" cy="688" r="137" fill="url(#g2)"/>
<g opacity=".78"><rect x="72" y="150" width="456" height="610" rx="34" class="screen"/><path d="M105 190h390M105 720h390" class="thin"/></g>
<path d="M38 88H562M38 812H562" stroke="#fff" stroke-opacity=".12"/>
<text x="300" y="82" class="label">// СЕРИАЛ</text>
<text x="300" y="470" class="title">Отель Хазбин</text>
<text x="300" y="798" class="year">2024</text>
<text x="300" y="842" class="meta">ЗАКАЗ: krichatel</text>
<rect width="600" height="900" fill="url(#scan)" opacity=".8"/>
<path d="M0 328h600M0 334h600M0 622h600" stroke="#ff00d4" stroke-opacity=".18" stroke-width="2"/>
<path d="M25 31h105v3H25zM470 866h105v3H470z" fill="#7b61ff" opacity=".7"/>
</svg>