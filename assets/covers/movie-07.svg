<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050507"/><stop offset=".55" stop-color="#141019"/><stop offset="1" stop-color="#030306"/></linearGradient>
 <radialGradient id="g1"><stop stop-color="#ff325f" stop-opacity=".32"/><stop offset="1" stop-color="#ff325f" stop-opacity="0"/></radialGradient>
 <radialGradient id="g2"><stop stop-color="#00f4ee" stop-opacity=".27"/><stop offset="1" stop-color="#00f4ee" stop-opacity="0"/></radialGradient>
 <filter id="glitch"><feTurbulence type="fractalNoise" baseFrequency=".012 .15" numOctaves="1" seed="90" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
