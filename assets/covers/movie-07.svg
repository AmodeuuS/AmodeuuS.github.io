  .meta{fill:#00f4ee;font-family:monospace;font-size:16px;text-anchor:middle;letter-spacing:1px;opacity:.9}
  .thin{stroke:#fff;stroke-opacity:.11;stroke-width:2} .frame{fill:none;stroke:#ff325f;stroke-opacity:.28;stroke-width:3} .holes rect{fill:#00f4ee;opacity:.25}
  .screen{fill:none;stroke:#00f4ee;stroke-opacity:.24;stroke-width:3} .spark{fill:#ff325f;opacity:.12;filter:url(#glitch)} .grid{stroke:#00f4ee;stroke-opacity:.08;stroke-width:1} .dpad{fill:#ff325f;opacity:.10}
 </style>
